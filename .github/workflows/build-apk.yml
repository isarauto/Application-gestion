name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruire la structure des dossiers
        run: |
          mkdir -p www/css www/js www/vendor www/fonts
          [ -f index.html ] && mv -f index.html www/ || true
          [ -f app.css ]    && mv -f app.css www/css/ || true
          [ -f app.js ]     && mv -f app.js www/js/ || true
          [ -f db.js ]      && mv -f db.js www/js/ || true
          ls -R www

      - name: Télécharger les librairies offline
        run: |
          curl -sSL -o www/vendor/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          curl -sSL -o www/vendor/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          curl -sSL -o www/vendor/jspdf.plugin.autotable.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js
          curl -sSL -o www/fonts/cairo-regular.woff2 "https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-400-normal.woff2" || true
          curl -sSL -o www/fonts/cairo-bold.woff2 "https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-700-normal.woff2" || true
          curl -sSL -o /tmp/cairo.ttf "https://cdn.jsdelivr.net/gh/google/fonts/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || true
          if [ -s /tmp/cairo.ttf ]; then
            { printf 'window.CAIRO_FONT_B64="'; base64 -w0 /tmp/cairo.ttf; printf '";\n'; } > www/vendor/cairo-font.js
          else
            echo 'window.CAIRO_FONT_B64=null;' > www/vendor/cairo-font.js
          fi
          ls -la www/vendor www/fonts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: gestion-location-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
